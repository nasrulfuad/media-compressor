[package]
name = "media-compressor"
version = "0.1.0"
edition = "2021"
authors = ["Nasrul <nasrulfuad08@gmail.com>"]
description = "Fast media compressor (PDF, images) written in Rust"
license = "MIT"
readme = "README.md"
repository = "https://github.com/nasrulfuad/media-compressor"
keywords = ["pdf", "image", "compression", "cli"]
categories = ["command-line-utilities"]

[dependencies]
# CLI
clap = { version = "4.5", features = ["derive", "color", "suggestions"] }

# PDF Manipulation
lopdf = "0.34"

# Stream Compression
flate2 = "1.0"

# Image Compression
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
mozjpeg = { version = "0.10", default-features = false }
oxipng = { version = "9.0", default-features = false, features = ["filetime"] }

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Logging & Output
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
colored = "2.1"
indicatif = "0.17"

# Parallel Processing
rayon = "1.10"

# File System
walkdir = "2.5"
globset = "0.4"

# Utilities
humansize = "2.1"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subsetter = "0.2.3"

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = "3.10"
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "compression_bench"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
